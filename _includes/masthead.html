<a class="academic-skip" href="{% if page.layout == 'academic' or page.layout == 'academic-publication' %}#main-content{% else %}#main{% endif %}">Skip to content</a>
<header class="academic-header">
  <div class="academic-header-inner">
    <a class="academic-brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="academic-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      {% for link in site.data.navigation.main %}
        <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
